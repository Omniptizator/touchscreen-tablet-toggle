name: Ubuntu package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      GIO_USE_VFS: local
    steps:
      - uses: actions/checkout@v4
      - name: Install build and integration test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential dpkg-dev debhelper python3-gi python3-libevdev python3-pyudev dbus-daemon libglib2.0-bin gjs
      - name: Build in a clean directory
        run: |
          mkdir -p /tmp/package/src
          tar --exclude=.git --exclude=dist -cf - . | tar -C /tmp/package/src -xf -
          cd /tmp/package/src
          dpkg-buildpackage -us -uc
          cd ..
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: resolute-package
          path: |
            /tmp/package/*.deb
            /tmp/package/*.dsc
            /tmp/package/*.tar.xz
            /tmp/package/*.changes
            /tmp/package/*.buildinfo
            /tmp/package/SHA256SUMS
