name: Native packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:26.04
          - distro: fedora
            image: registry.fedoraproject.org/fedora:45
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - if: matrix.distro == 'ubuntu'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper pkgconf libglib2.0-dev libudev-dev libevdev-dev gjs dbus-daemon gnome-shell libgl1-mesa-dri
      - if: matrix.distro == 'fedora'
        run: dnf install -y gcc make glib2-devel systemd-devel libevdev-devel rpm-build systemd-rpm-macros gjs dbus-daemon gnome-shell mesa-dri-drivers
      - run: ./verify-release ${{ matrix.distro }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}-native
          path: dist/native/
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find packages -type f \( -name '*.rpm' -o -name '*.deb' \) -exec cp -t release {} +
          cd release
          sha256sum *.deb *.rpm > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tablet-only Touchscreen $GITHUB_REF_NAME" \
            --notes "Native service and GNOME Quick Setting for Ubuntu 26.04 and Fedora Workstation 45. Finger touch follows the laptop's tablet-mode switch." \
            *.deb *.rpm SHA256SUMS
